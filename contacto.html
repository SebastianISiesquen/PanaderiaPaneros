<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Panadería Paneros</title>
    <link rel="icon" href="imagenes/Logo_Paneros.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="css/estilos.css">
    <script>window.activePage = 'contacto';</script>
</head>
<body class="fondo-panderia">

    <div id="header"></div>

    <main class="main">

        <section class="section">
            <div class="container">
                <div class="section-header reveal">
                    <div class="cinta">
                        <h2>Contacto</h2>
                    </div>
                </div>

                <div class="contact-grid">
                    <!-- Medios de contacto -->
                    <div class="contact-card reveal">
                        <h4><i class="fa-solid fa-address-book"></i> Medios de contacto</h4>
                        <div class="contact-dato">
                            <i class="fa-solid fa-phone"></i>
                            <div>
                                <strong>Teléfono 01</strong>
                                <span>947 757 328</span>
                            </div>
                        </div>
                        <div class="contact-dato">
                            <i class="fa-solid fa-phone"></i>
                            <div>
                                <strong>Teléfono 02</strong>
                                <span>947 649 591</span>
                            </div>
                        </div>
                        <div class="contact-dato">
                            <i class="fa-solid fa-envelope"></i>
                            <div>
                                <strong>Email</strong>
                                <span>Panaderiapaneros@hotmail.com</span>
                            </div>
                        </div>
                        <div class="contact-dato">
                            <i class="fa-solid fa-location-dot"></i>
                            <div>
                                <strong>Dirección</strong>
                                <span>Av. La Libertad 552, Urb. Santa Victoria, Chiclayo</span>
                            </div>
                        </div>
                        <div class="contact-logo">
                            <img src="imagenes/Logo_Paneros.png" alt="Logo de Panadería Paneros">
                        </div>
                    </div>

                    <!-- Formulario -->
                    <div class="contact-card reveal">
                        <h4><i class="fa-solid fa-pen-to-square"></i> Escríbenos</h4>
                        <form id="contactForm">
                            <div class="form-group">
                                <label for="name">Nombre</label>
                                <input type="text" class="form-control" id="name" placeholder="Ingresa tu nombre" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="Tu correo electrónico" required>
                            </div>
                            <div class="form-group">
                                <label for="message">Mensaje</label>
                                <textarea class="form-control" id="message" rows="3" placeholder="Tu mensaje" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primario btn--bloque">Enviar Mensaje</button>
                        </form>
                    </div>
                </div>

                <!-- Ubícanos -->
                <div class="mapa reveal">
                    <div class="section-header">
                        <div class="cinta">
                            <h2>Ubícanos</h2>
                        </div>
                    </div>
                    <div class="mapa__marco">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3961.891527504655!2d-79.84234202408952!3d-6.783053593214028!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x904cef3014ad3f75%3A0x58994bd26f4fe3ce!2sAv.%20Libertad%20552%2C%20Chiclayo%2014008!5e0!3m2!1ses!2spe!4v1733608152361!5m2!1ses!2spe" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Ubicación de Panadería Paneros"></iframe>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div id="footer"></div>

    <div id="toast-container"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
